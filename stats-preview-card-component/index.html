<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Frontend Mentor | Stats preview card component</title>
  </head>
  <body>
    <main class="min-h-screen w-full flex items-center justify-center bg-Black">
      <section>
        <div
          class="my-[5.5rem] mx-6 lg:flex lg:flex-row-reverse lg:items-center lg:justify-center lg:h-[446px] lg:w-[1110px]"
        >
          <picture
            class="relative h-full lg:min-w-[540px]"
          >
            <source
              srcset="./src/images/image-header-desktop.jpg"
              media="(min-width: 1024px)"
            />
            <img
              class="block max-w-full h-full border-img "
              src="./src/images/image-header-mobile.jpg"
              alt="Business team working in an office"
            />
            <div class="overlay"></div>
          </picture>
          <div
            class="pt-10 pb-8 px-8 bg-card text-center h-full lg:pt-[4.438rem] border-card lg:pb-[3.688rem] lg:pl-[4.469rem] lg:pr-[7.813rem] lg:text-left"
          >
            <h1
              class="text-[1.75rem] text-WhiteHeading font-Inter font-bold leading-8 lg:text-4xl lg:leading-11"
            >
              Get <span class="text-Purple">insights</span> that help your
              business grow.
            </h1>
            <p
              class="mt-4 mb-10 text-WhiteParagraph leading-[1.563rem] lg:mt-6 lg:mb-[4.5rem]"
            >
              Discover the benefits of data analytics and make better decisions
              regarding revenue, customer experience, and overall efficiency.
            </p>
            <div
              class="flex flex-col items-center gap-6 lg:flex-row lg:gap-[3.75rem]"
            >
              <div class="flex flex-col items-center gap-0.5 lg:items-start">
                <span
                  class="text-WhiteHeading text-2xl font-bold leading-[normal]"
                  >10k+</span
                >
                <span
                  class="text-xs text-WhiteStat font-Lexend leading-[1.563rem] tracking-[1px] uppercase"
                  >companies</span
                >
              </div>
              <div class="flex flex-col items-center gap-0.5 lg:items-start">
                <span
                  class="text-WhiteHeading text-2xl font-bold leading-[normal]"
                  >314</span
                >
                <span
                  class="text-xs text-WhiteStat font-Lexend leading-[1.563rem] tracking-[1px] uppercase"
                  >templates</span
                >
              </div>
              <div class="flex flex-col items-center gap-0.5 lg:items-start">
                <span
                  class="text-WhiteHeading text-2xl font-bold leading-[normal]"
                  >12m+</span
                >
                <span
                  class="text-xs text-WhiteStat font-Lexend leading-[1.563rem] tracking-[1px] uppercase"
                >
                  queries</span
                >
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
