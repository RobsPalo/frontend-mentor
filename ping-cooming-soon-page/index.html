<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Ping coming soon page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>

    <div class="min-h-screen w-full flex flex-col items-center my-12">
      <div class="w-full flex flex-col items-center my-12 md:my-[7.5rem] lg:mt-[2.5rem] lg:mb-0">
        <header>
          <img
            class="block w-full md:w-[7rem] lg:w-[88px]"
            src="./src/images/logo.svg"
            alt="Ping Logo"
          />
        </header>
        
        <main class="my-20 flex flex-col items-center md:mt-[4.75rem] md:mb-32 lg:mt-10 lg:mb-[4.5rem]">
          <h1
            class="text-2xl text-Gray400 font-light leading-[normal] mb-3.5 px-8 md:text-[2.75rem] md:mb-[2.2rem] lg:text-5xl lg:mb-5"
          >
            We are launching
            <span class="text-Blue950 font-extrabold">soon!</span>
          </h1>
          <p class="text-lg text-Blue950 text-center md:text-2xl lg:text-[1.2rem]">
            Subscribe and get notified
          </p>
          <form
            class="flex flex-col gap-4 items-center my-12 w-[300px] max-w-full mx-auto md:mt-16 md:my-32 md:mx-0 md:w-[550px] md:gap-7 lg:mt-9 lg:mb-20 lg:flex-row lg:w-[90%] "
            action="#"
            id="notify-form"
            name="notify-form"
            onsubmit="return false;"
          >
            <input
              class="border-0 outline-1 outline-Gray400 py-2.5 px-1.5 pl-10 rounded-[1.56rem] w-full mx-auto placeholder:text-base md:placeholder:text-lg md:py-4 lg:flex-2 lg:py-3"
              type="email"
              name="email"
              id="email"
              placeholder="Your email address..."
              required
            />
            <button
              class="border-0 outline-1 outline-Gray400 py-3 px-1.5 rounded-[1.56rem] w-full mx-auto bg-Blue500 text-white text-lg font-bold hover:bg-blue-300 cursor-pointer md:py-4 md:text-[20px] lg:flex-1 lg:text-base"
              type="submit"
            >
              Notify Me
            </button>
          </form>
          <img
            class="block w-full max-w-full px-3 md:w-[700px] lg:w-[681px]"
            src="./src/images/illustration-dashboard.png"
            alt="Ping Dashboard Abstract Illustration"
          />
        </main>
      </div>
     
      <footer class="flex flex-col items-center gap-6 md:gap-16 lg:gap-4">
        <div>
          <ul class="flex items-center justify-center gap-4 md:gap-16 lg:gap-5">
            <li class="flex items-center ">
              <a class="text-Blue500" href="#"><i class="flex items-center justify-center h-[30px] fa-brands fa-facebook-f md:text-2xl lg:text-base"></i></a>
            </li>
            <li class="flex items-center">
              <a class="text-Blue500" href="#"><i class="flex items-center justify-center h-[30px] fa-brands fa-twitter md:text-2xl lg:text-base"></i></a>
            </li>
            <li class="flex items-center justify-center">
              <a class="text-Blue500" href="#"><i class="flex items-center justify-center h-[30px] fa-brands fa-instagram md:text-2xl lg:text-base"></i></a>
            </li>
          </ul>
        </div>
        <span class="text-sm md:text-2xl lg:text-base">&copy; Copyright Ping. All rights reserved.</span>
      </footer>
    </div>
  </body>
</html>
